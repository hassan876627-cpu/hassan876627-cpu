<svg width="100%" height="260" viewBox="0 0 1200 260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#05060f"/>
      <stop offset="55%" stop-color="#0b0f2b"/>
      <stop offset="100%" stop-color="#161a3d"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="260" fill="url(#sky)"/>
  <rect width="1200" height="260" fill="url(#glow)"/>

  <!-- twinkling stars -->
  <g fill="#ffffff">
    <circle cx="40" cy="40" r="1.4"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.4s" repeatCount="indefinite" begin="0s"/></circle>
    <circle cx="95" cy="120" r="1"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.1s" repeatCount="indefinite" begin="0.4s"/></circle>
    <circle cx="150" cy="60" r="1.6"><animate attributeName="opacity" values="0.15;1;0.15" dur="2.8s" repeatCount="indefinite" begin="1.1s"/></circle>
    <circle cx="200" cy="190" r="1.2"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.2s" repeatCount="indefinite" begin="0.7s"/></circle>
    <circle cx="260" cy="30" r="1"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.4s" repeatCount="indefinite" begin="1.6s"/></circle>
    <circle cx="310" cy="150" r="1.5"><animate attributeName="opacity" values="0.15;1;0.15" dur="2.6s" repeatCount="indefinite" begin="0.2s"/></circle>
    <circle cx="360" cy="80" r="1"><animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite" begin="1.3s"/></circle>
    <circle cx="410" cy="210" r="1.3"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.5s" repeatCount="indefinite" begin="0.9s"/></circle>
    <circle cx="470" cy="45" r="1.6"><animate attributeName="opacity" values="0.15;1;0.15" dur="2.9s" repeatCount="indefinite" begin="0.5s"/></circle>
    <circle cx="520" cy="130" r="1"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.2s" repeatCount="indefinite" begin="1.8s"/></circle>
    <circle cx="60" cy="220" r="1.1"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.7s" repeatCount="indefinite" begin="1s"/></circle>
    <circle cx="130" cy="20" r="1.3"><animate attributeName="opacity" values="0.15;1;0.15" dur="3.3s" repeatCount="indefinite" begin="0.3s"/></circle>

    <circle cx="700" cy="35" r="1.4"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.6s" repeatCount="indefinite" begin="0.6s"/></circle>
    <circle cx="750" cy="115" r="1"><animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite" begin="1.2s"/></circle>
    <circle cx="800" cy="55" r="1.6"><animate attributeName="opacity" values="0.15;1;0.15" dur="2.9s" repeatCount="indefinite" begin="0.1s"/></circle>
    <circle cx="850" cy="185" r="1.2"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.3s" repeatCount="indefinite" begin="1.5s"/></circle>
    <circle cx="900" cy="25" r="1"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.5s" repeatCount="indefinite" begin="0.8s"/></circle>
    <circle cx="950" cy="145" r="1.5"><animate attributeName="opacity" values="0.15;1;0.15" dur="2.7s" repeatCount="indefinite" begin="1.9s"/></circle>
    <circle cx="1000" cy="75" r="1"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.1s" repeatCount="indefinite" begin="0.4s"/></circle>
    <circle cx="1050" cy="200" r="1.3"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.4s" repeatCount="indefinite" begin="1.4s"/></circle>
    <circle cx="1100" cy="40" r="1.6"><animate attributeName="opacity" values="0.15;1;0.15" dur="2.8s" repeatCount="indefinite" begin="0.2s"/></circle>
    <circle cx="1150" cy="125" r="1"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.3s" repeatCount="indefinite" begin="1.7s"/></circle>
    <circle cx="1160" cy="215" r="1.1"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.5s" repeatCount="indefinite" begin="0.9s"/></circle>
    <circle cx="1120" cy="15" r="1.3"><animate attributeName="opacity" values="0.15;1;0.15" dur="3.4s" repeatCount="indefinite" begin="0.3s"/></circle>

    <circle cx="600" cy="60" r="1.2"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.5s" repeatCount="indefinite" begin="1s"/></circle>
    <circle cx="640" cy="190" r="1"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.2s" repeatCount="indefinite" begin="0.5s"/></circle>
