  <!-- shooting stars -->
  <g stroke="#ffffff" stroke-width="1.5" stroke-linecap="round">
    <line x1="0" y1="0" x2="60" y2="30" opacity="0">
      <animate attributeName="opacity" values="0;1;0" dur="1.6s" begin="1s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="150,20; 420,110" dur="1.6s" begin="1s" repeatCount="indefinite"/>
    </line>
    <line x1="0" y1="0" x2="55" y2="26" opacity="0">
      <animate attributeName="opacity" values="0;1;0" dur="1.8s" begin="4.5s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="820,30; 1080,140" dur="1.8s" begin="4.5s" repeatCount="indefinite"/>
    </line>
  </g>

  <text x="600" y="150" text-anchor="middle" font-family="Poppins, Segoe UI, sans-serif" font-size="46" font-weight="600" fill="#f1f5f9">Hassan Imran</text>
  <text x="600" y="185" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="15" fill="#94a3b8">Cyber Security • Video Editing • Development</text>
</svg>
